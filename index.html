<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ensure window.fetch is configurable so environment inspection or parent wrappers don't throw
      try {
        const originalFetch = window.fetch;
        let _fetch = originalFetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _fetch;
          },
          set(fn) {
            _fetch = fn;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Fallback gracefully
      }
    </script>
